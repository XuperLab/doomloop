# Deploy config for Doomloop — Sprint 4
# Static Vite-built web application (Three.js + Cannon-es)

app_name: doomloop
app_type: static-site
build_command: npm run build
build_output_dir: dist
build_output_files:
  - index.html
  - assets/
  - doomloop-screens/

serve_static_from: dist

env:
  NODE_VERSION: "18"

health_check:
  type: http
  path: /index.html
  expected_status: 200

post_deploy:
  - echo "Doomloop Sprint 4 deployed — check /index.html"

# If deploying to Dokploy:
dokploy:
  app_type: static
  build_method: dockerfile
  ports: []

# If deploying via static-site-deployment (simple tunnel/dev server):
static_site:
  entry: dist/index.html
  fallback: dist/index.html
